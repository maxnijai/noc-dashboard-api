<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เปลี่ยนรหัสผ่าน — Intelligent Productivity Dashboard</title>
<style>
  :root {
    --bg: #eef3fa; --bg2: #ffffff; --bg3: #f5f9fd;
    --border: #d9e4f0; --text: #1c2a3a; --text2: #52657a; --text3: #8496a8;
    --blue: #2f6fd6; --red: #d1453d; --green: #2e9e4f; --r: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans Thai', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 32px; width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  h1 { font-size: 17px; margin-bottom: 4px; }
  p.sub { color: var(--text3); font-size: 12px; margin-bottom: 20px; }
  label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:14px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:var(--r); font-size:14px; background:var(--bg3); color:var(--text); }
  button { width:100%; margin-top:20px; padding:10px; border:none; border-radius:var(--r); background:var(--blue); color:#fff; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { opacity:.92; }
  .error { color:var(--red); font-size:12px; margin-top:10px; }
  .notice { color:var(--text2); font-size:12px; margin-top:10px; background:var(--bg3); padding:8px 10px; border-radius:var(--r); }
</style>
</head>
<body>
  <form class="card" method="POST" action="/change-password">
    <h1>เปลี่ยนรหัสผ่าน</h1>
    <p class="sub">สวัสดี {{ name }}</p>
    {% if must_change %}<div class="notice">เข้าสู่ระบบครั้งแรก กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="current_password">รหัสผ่านปัจจุบัน</label>
    <input type="password" id="current_password" name="current_password" required autofocus>
    <label for="new_password">รหัสผ่านใหม่</label>
    <input type="password" id="new_password" name="new_password" required minlength="4">
    <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="4">
    <button type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
</body>
</html>
