<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Dashboard — BBTEC NOR</title>
<style>
:root {
  --bg:       #0d1117;
  --bg2:      #161b22;
  --bg3:      #21262d;
  --border:   #30363d;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --blue:     #58a6ff;
  --green:    #3fb950;
  --yellow:   #d29922;
  --red:      #f85149;
  --purple:   #bc8cff;
  --font:     'Sarabun', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

/* ── Header ── */
.header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 700; color: var(--blue); }
.header .sub { color: var(--muted); font-size: 12px; }
.back-btn { color: var(--muted); text-decoration: none; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; transition: .15s; }
.back-btn:hover { color: var(--text); border-color: var(--blue); }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); background: var(--bg2); }
.tab { padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--muted); font-size: 13px; border: 1px solid transparent; border-bottom: none; transition: .15s; }
.tab.active { background: var(--bg); color: var(--blue); border-color: var(--border); border-bottom-color: var(--bg); }
.tab:hover:not(.active) { color: var(--text); }

/* ── Main ── */
.main { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* ── KPI Cards ── */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.kpi .val { font-size: 28px; font-weight: 700; line-height: 1; }
.kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.kpi.blue .val { color: var(--blue); }
.kpi.green .val { color: var(--green); }
.kpi.yellow .val { color: var(--yellow); }
.kpi.red .val { color: var(--red); }

/* ── Progress Bar ── */
.prog-wrap { margin-bottom: 20px; }
.prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.prog-bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.prog-fill.green { background: var(--green); }
.prog-fill.blue  { background: var(--blue); }

/* ── Search ── */
.search-wrap { display: flex; gap: 8px; margin-bottom: 16px; }
.search-input { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--blue); }
.search-input::placeholder { color: var(--muted); }
.btn { background: var(--blue); color: #000; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; }
.btn:hover { opacity: .85; }
.btn.sec { background: var(--bg3); color: var(--text); }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--bg3); color: var(--muted); font-size: 11px; text-align: left; padding: 10px 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge.pass  { background: #1a3d2a; color: var(--green); }
.badge.fail  { background: #3d1a1a; color: var(--red); }
.badge.pend  { background: #2d2a1a; color: var(--yellow); }
.badge.na    { background: var(--bg3); color: var(--muted); }

/* ── Chart ── */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.chart-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
.bar-list { display: flex; flex-direction: column; gap: 8px; }
.bar-item { display: flex; align-items: center; gap: 8px; }
.bar-item .name { width: 80px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.bar-item .track { flex: 1; height: 16px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.bar-item .fill  { height: 100%; border-radius: 4px; }
.bar-item .cnt   { width: 32px; text-align: right; font-size: 12px; color: var(--text); }

/* ── Section header ── */
.sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sec-title { font-size: 15px; font-weight: 600; }

/* ── Loading ── */
.loading { text-align: center; padding: 40px; color: var(--muted); }
.spin { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Panel tabs ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .chart-row { grid-template-columns: 1fr; }
  .kpi-row   { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <a href="/" class="back-btn">← NOC Dashboard</a>
  <div>
    <h1>🔧 PM Dashboard</h1>
    <div class="sub" id="cached-at">กำลังโหลด...</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview')">📊 ภาพรวม</div>
  <div class="tab" onclick="switchTab('dn')">PM Small (DN)</div>
  <div class="tab" onclick="switchTab('nodeb')">PM NodeB</div>
  <div class="tab" onclick="switchTab('broadband')">PM Broadband</div>
</div>

<div class="main">

  <!-- Overview Tab -->
  <div id="tab-overview" class="panel active">
    <div class="loading" id="loading-ov">
      <div class="spin"></div><br>กำลังโหลดข้อมูล PM...
    </div>
    <div id="ov-content" style="display:none">
      <!-- KPI แยกแต่ละ sheet -->
      <div id="kpi-dn"></div>
      <div id="kpi-nodeb"></div>
      <div id="kpi-broadband"></div>
      <!-- Chart -->
      <div class="chart-row" id="charts"></div>
    </div>
  </div>

  <!-- DN Tab -->
  <div id="tab-dn" class="panel">
    <div style="margin-bottom:16px">
      <div class="search-wrap">
        <input class="search-input" id="search-dn" placeholder="ค้นหา Site ID..." oninput="filterTable('dn')">
        <button class="btn sec" onclick="clearSearch('dn')">ล้าง</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Site ID</th><th>PM Date</th><th>Team</th>
          <th>Bat#1 BT</th><th>Bat#2 BT</th><th>Verify</th>
        </tr></thead>
        <tbody id="tbody-dn"></tbody>
      </table>
    </div>
  </div>

  <!-- NodeB Tab -->
  <div id="tab-nodeb" class="panel">
    <div class="search-wrap">
      <input class="search-input" id="search-nodeb" placeholder="ค้นหา Site ID..." oninput="filterTable('nodeb')">
      <button class="btn sec" onclick="clearSearch('nodeb')">ล้าง</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Site ID</th><th>Cabinet</th><th>Backup Time (Min.)</th><th>Verify</th>
        </tr></thead>
        <tbody id="tbody-nodeb"></tbody>
      </table>
    </div>
  </div>

  <!-- Broadband Tab -->
  <div id="tab-broadband" class="panel">
    <div class="search-wrap">
      <input class="search-input" id="search-broadband" placeholder="ค้นหา Site ID..." oninput="filterTable('broadband')">
      <button class="btn sec" onclick="clearSearch('broadband')">ล้าง</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Site ID</th><th>PM Date</th><th>Team</th>
          <th>Bat#1 BT</th><th>Bat#2 BT</th><th>Verify</th>
        </tr></thead>
        <tbody id="tbody-broadband"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
let _data = null;
const TAB_KEYS = { dn: 'DN', nodeb: 'NodeB', broadband: 'Broadband' };

async function loadData() {
  try {
    const res  = await fetch('/api/pm/summary');
    _data = await res.json();
    document.getElementById('cached-at').textContent =
      'อัปเดต: ' + new Date(_data.cached_at).toLocaleString('th-TH');
    renderOverview();
    renderTable('dn');
    renderTable('nodeb');
    renderTable('broadband');
    document.getElementById('loading-ov').style.display = 'none';
    document.getElementById('ov-content').style.display = 'block';
  } catch(e) {
    document.getElementById('loading-ov').innerHTML = `<div style="color:var(--red)">❌ โหลดข้อมูลไม่ได้: ${e.message}</div>`;
  }
}

function badgeVfy(v) {
  if (!v) return '<span class="badge na">-</span>';
  const u = v.toUpperCase();
  if (['PASS','VERIFIED','✓','ผ่าน'].some(x => u.includes(x)))
    return `<span class="badge pass">✅ ${v}</span>`;
  if (['FAIL','NOK','ไม่ผ่าน'].some(x => u.includes(x)))
    return `<span class="badge fail">❌ ${v}</span>`;
  return `<span class="badge pend">${v}</span>`;
}

function kpiCard(label, val, sub, cls='blue') {
  return `<div class="kpi ${cls}">
    <div class="label">${label}</div>
    <div class="val">${val}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

function progBar(label, pct, cls='green') {
  return `<div class="prog-wrap">
    <div class="prog-label"><span>${label}</span><span>${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}

function renderOverview() {
  const sheets = [
    { key: 'DN',        label: 'PM Small (DN)',   id: 'kpi-dn' },
    { key: 'NodeB',     label: 'PM NodeB',         id: 'kpi-nodeb' },
    { key: 'Broadband', label: 'PM Broadband',     id: 'kpi-broadband' },
  ];
  for (const s of sheets) {
    const d = _data[s.key] || {};
    if (d.error) {
      document.getElementById(s.id).innerHTML = `<div style="color:var(--red);margin-bottom:16px">❌ ${s.label}: ${d.error}</div>`;
      continue;
    }
    document.getElementById(s.id).innerHTML = `
      <div class="sec-header" style="margin-top:16px"><div class="sec-title">${s.label}</div></div>
      <div class="kpi-row">
        ${kpiCard('Total Site', d.total, '', 'blue')}
        ${kpiCard('PM Done', d.pm_done, `${d.pm_pct}%`, 'green')}
        ${kpiCard('Pending', d.pending, 'ยังไม่ได้ PM', 'yellow')}
        ${kpiCard('Verified', d.vfy_done, `${d.vfy_pct}%`, 'green')}
      </div>
      ${progBar('ความคืบหน้า PM', d.pm_pct, 'green')}
      ${progBar('Verify แล้ว', d.vfy_pct, 'blue')}
    `;
  }

  // Bar chart: PM Done vs Pending per sheet
  const chartHtml = `
    <div class="chart-box">
      <div class="chart-title">จำนวน Site ตาม Sheet</div>
      <div class="bar-list">${
        sheets.map(s => {
          const d = _data[s.key] || {};
          const max = d.total || 1;
          return `
            <div style="margin-bottom:12px">
              <div style="font-size:12px;margin-bottom:4px;color:var(--text)">${s.label}</div>
              <div class="bar-item">
                <span class="name" style="color:var(--green)">PM Done</span>
                <div class="track"><div class="fill" style="width:${(d.pm_done/max)*100}%;background:var(--green)"></div></div>
                <span class="cnt">${d.pm_done||0}</span>
              </div>
              <div class="bar-item">
                <span class="name" style="color:var(--yellow)">Pending</span>
                <div class="track"><div class="fill" style="width:${(d.pending/max)*100}%;background:var(--yellow)"></div></div>
                <span class="cnt">${d.pending||0}</span>
              </div>
            </div>`;
        }).join('')
      }</div>
    </div>
    <div class="chart-box">
      <div class="chart-title">% Verify แต่ละ Sheet</div>
      <div class="bar-list">${
        sheets.map(s => {
          const d = _data[s.key] || {};
          return `
            <div class="bar-item">
              <span class="name">${s.label.replace('PM ','')}</span>
              <div class="track"><div class="fill" style="width:${d.vfy_pct||0}%;background:var(--blue)"></div></div>
              <span class="cnt">${d.vfy_pct||0}%</span>
            </div>`;
        }).join('')
      }</div>
    </div>
  `;
  document.getElementById('charts').innerHTML = chartHtml;
}

function renderTable(key) {
  const tabKey = TAB_KEYS[key];
  const d = _data?.[tabKey];
  if (!d || !d.site_rows) return;
  const tbody = document.getElementById(`tbody-${key}`);
  tbody.innerHTML = d.site_rows.map(r => {
    if (key === 'nodeb') {
      return `<tr data-site="${r.site_id}">
        <td><b>${r.site_id}</b></td>
        <td>${r.team || '-'}</td>
        <td>${r.bat_bt || '-'} Min.</td>
        <td>${badgeVfy(r.vfy_st)}</td>
      </tr>`;
    }
    return `<tr data-site="${r.site_id}">
      <td><b>${r.site_id}</b></td>
      <td>${r.pm_date || '-'}</td>
      <td>${r.team || '-'}</td>
      <td>${r.bat_bt || '-'} Min.</td>
      <td>-</td>
      <td>${badgeVfy(r.vfy_st)}</td>
    </tr>`;
  }).join('');
}

function filterTable(key) {
  const q = document.getElementById(`search-${key}`).value.toLowerCase();
  document.querySelectorAll(`#tbody-${key} tr`).forEach(tr => {
    tr.style.display = tr.dataset.site.toLowerCase().includes(q) ? '' : 'none';
  });
}

function clearSearch(key) {
  document.getElementById(`search-${key}`).value = '';
  filterTable(key);
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

loadData();
</script>
</body>
</html>
